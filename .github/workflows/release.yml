name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 构建网页
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web run build

      - uses: astral-sh/setup-uv@v6
      - name: 构建 wheel（网页、模板、skill 一并打进包里）
        run: uv build --wheel

      - name: 核对标签与包版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls dist/dsflow-"$tag"-py3-none-any.whl

      - name: 从 CHANGELOG 截取本版本的说明
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found=1 } }
            found { print }
          ' docs/CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "见 docs/CHANGELOG.md" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: true
          files: dist/*.whl
