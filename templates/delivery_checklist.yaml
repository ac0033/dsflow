# 交付清单模板（放在被管项目的 delivery/<模型名>/checklist.yaml）。下面的内容取自演示项目 examples/demo_project 的实际清单。
# 一般不手写全文：先 `uv run dsflow delivery init <项目> <模型名>` 生成草稿——
#   model / version / reproduce / data / metrics 的数值由平台按模型登记与运行记录填好；
#   其余字段写着「待填」，由执行 agent 或负责人补完。再 `dsflow delivery init` 只刷新前面那几项，人写的部分保留。
# 平台核对：版本与登记一致、数据版本与指标数值与产出运行一致、产物文件都在、没有「待填」。
model: sku_demand_linear
version: 65cd04dbf982            # 模型文件 SHA256 前 12 位（平台填）
summary: 交付 SKU 月度需求量预测模型（演示），用来回答「下个月哪些 SKU 需要提前备货」
reproduce:                        # 复现入口（平台按运行记录生成）
  - git checkout <运行时的 commit>
  - uv run dsflow data verify . "steps/04_特征工程/4.1_月度特征/outputs/features.parquet" <sha256>
  - uv run dsflow run 7.1 -- python -m dsflow.tracking.notebook steps/07_模型选择与训练/7.1_线性模型训练/nb_7.1.ipynb
  - uv run dsflow data verify . "steps/07_模型选择与训练/7.1_线性模型训练/outputs/model.json" <sha256>    # 核对模型文件
usage:                            # 使用入口：怎样用这个模型得到结果
  - uv run python -m dsflow.tracking.notebook "steps/11_部署与交付/11.1_交付与预测/nb_11.1.ipynb" --param MONTH=2026-07
data:                             # 训练数据版本（平台填）
  - name: features
    version: 63a80b30551a
    path: steps/04_特征工程/4.1_月度特征/outputs/features.parquet
metrics:                          # 数值由平台填；baseline（对照）与 scope（口径）由人写
  - name: MAE_最终评估
    value: 6.6127
    baseline: 同期近 6 月均值基线 6.8679，低 3.7%
    scope: 最终评估期 2026-04～06 共 9,000 个 SKU 月，每个 SKU 月一个绝对误差取平均；模型用训练期 + 验证期拟合，只评估一次
applicability:
  scope:                          # 适用于什么：对象、期间、粒度
    - 已有 6 个月以上订单历史的 SKU，按月预测紧接的下一个月的需求量
  not_for:                        # 不适用于什么
    - 订单历史不足 6 个月的新 SKU
    - 按天、按周的需求量；隔一个月以上的预测
  data_period: 订单下单时间 2024-07 至 2026-06；模型拟合用 2025-01 至 2026-03
  known_weaknesses:
    - 大促、集中采购等一次性大单没有单独处理
monitoring:                       # 上线后看什么、到多少算异常、多久看一次、超过后做什么
  - metric: 每月实际需求量出来后，上个月预测的 MAE（SKU 月粒度）
    threshold: 连续 2 个月高于 7.9（最终评估期 MAE 6.61 的 1.2 倍）
    frequency: 每月初
    action: 回到 7.1 用最新月份重新训练，登记为新版本，交付清单重新核对
deployment: 待定                  # 部署方式未定就写「待定」
artifacts:
  - path: steps/07_模型选择与训练/7.1_线性模型训练/outputs/model.json
    purpose: 模型文件
    kind: model
open_items:                       # 交付时仍未解决、使用方需要知道的问题
  - 提前备货规则（预测需求量 ≥ 近 3 月均值 × 1.3 且 ≥ 10）是演示用规则，需业务确认
