# DSFlow 内置术语表：数据科学里常用、但没做过数据科学的人不一定熟悉的词，一律用白话解释。
# 项目自己的说法写在项目的 vocabulary.json；某一步特有的说法写在该步导读的 terms 里。
# 同名时：本步 > 项目 > 内置。界面上第一次出现的术语会标出来，鼠标停上去看解释。

- term: QC
  aliases: [质量控制]
  plain: 质量控制（Quality Control）。在数据处理里指清洗过程留下的核对记录：哪一步删了多少行、金额差了多少、为什么。

- term: 主键
  plain: 能唯一确定一行记录的字段或字段组合，相当于这行数据的身份证号。主键重复说明同一条记录出现了不止一次。

- term: 完全重复行
  aliases: [完全重复]
  plain: 所有字段都一模一样的行，通常是导出或拼接时多出来的，删掉不会丢失信息。

- term: 去重
  plain: 把重复的行删到只剩一份。要写清楚按什么判断重复：全部字段一样，还是主键一样。

- term: 缺失值
  aliases: [空值, NaN]
  plain: 本该有值的格子是空的。先弄清为什么空（事情没发生、没记录、还是出错），再决定删掉、补上还是保留并标记。

- term: 对账
  plain: 拿两处独立算出来的合计（行数、金额）互相核对，确认处理前后账是平的，没有无故多出或少掉。

- term: 归因
  plain: 把处理前后的差额逐项对应到具体规则上，例如“少了 6 行 = 删重复 1 行 + 合并掉 5 行”。对不上就说明有数据去向不明。

- term: 恒等式
  plain: 必须严格相等的算式，例如“原始行数 − 删除行数 = 剩余行数”。不相等就是出了问题，不能用“差不多”糊过去。

- term: 断言
  aliases: [assert]
  plain: 代码里的“必须成立”检查。条件不成立时程序立刻报错停下，不会带着错误结果继续往下跑。

- term: 回填
  plain: 用别的字段或规则把空着的值补上，例如按商品名称补出品牌。补上的值必须能说清来源。

- term: 归一
  aliases: [归并]
  plain: 把指向同一个对象的多种写法或编码合并成一个统一身份，例如同一件商品的几个名称统一成一个。

- term: 规范化
  plain: 把同一个内容的不同写法统一，例如全角字符转半角、去掉首尾空格。只改写法，不改含义。

- term: 口径
  plain: 一个数字的计算范围和规则：数的是记录数还是不同值个数、算哪段时间、含不含退货。口径不同的数字不能直接比较。

- term: 粒度
  plain: 一行数据代表什么：一个订单行、一个 SKU 的一个月……粒度不同的表不能直接相加或相减。

- term: 字段
  plain: 数据表里的一列。

- term: schema
  aliases: [表结构]
  plain: 数据表的结构：有哪些列、每列是什么类型。结构变了，下游的代码往往就跑不通。

- term: dtype
  aliases: [数据类型]
  plain: 每一列的数据类型：整数、小数、文本、日期。类型不对（例如数字被存成文本）会让计算和排序出错。

- term: 数据画像
  aliases: [画像]
  plain: 不逐行看数据，而是看它的整体情况：行数、每列的缺失比例、取值范围、分布。数据量大时只能这样看。

- term: 分布
  plain: 一列数值都落在哪里：大部分在什么范围、有没有极端值。常用直方图或分位数看。

- term: 分位数
  aliases: [中位数]
  plain: 把数值从小到大排好后处在某个位置上的值。中位数就是 50% 分位数，一半的数比它小、一半比它大。

- term: 离群值
  aliases: [异常值]
  plain: 明显偏离大多数的值。可能是真实的大单，也可能是录入错误，两种要分开看，不能一删了事。

- term: 覆盖率
  plain: 有值（或被规则覆盖到）的行占全部行的比例。

- term: 残差
  plain: 实际值减去预期值或预测值剩下的差。对账时残差为 0 表示完全对上。

- term: 容差
  plain: 比较两个数时允许的极小差距（例如小数舍入造成的 0.0001）。在容差内就算相等，超出就算不一致。

- term: 哈希
  aliases: [SHA256, 指纹]
  plain: 按文件内容算出的一串固定长度的字符。内容哪怕改一个字节，这串字符就完全不同，所以用它确认文件没被改过。

- term: Parquet
  plain: 一种按列存储、自带类型的数据文件格式。比 Excel、CSV 读得快、占空间小，适合几十万行以上的数据。

- term: DataFrame
  plain: Python 的 pandas 库里的数据表对象，可以理解成内存里的一张 Excel 表，有行有列有类型。

- term: notebook
  plain: 把代码、运行结果和文字说明写在一起的文件（.ipynb）。一格代码下面紧跟着它跑出来的输出。

- term: 单元格
  plain: notebook 里的一格。代码单元格运行后在下方显示输出，说明单元格只有文字。

- term: 连接
  aliases: [关联, join]
  plain: 按共同的字段把两张表拼起来，例如按 SKU 编码把商品信息接到订单上。连接后行数变了，说明存在一对多或对不上的情况。

- term: 一对多
  plain: 一个值在另一张表里对应多行。连接时会让行数变多（同一笔订单被复制成几行），是很常见的出错原因。

- term: 宽表
  plain: 把多张表连接成的一张列很多的大表，一行就包含一个对象的全部信息。

- term: 聚合
  plain: 把多行汇总成一行，例如按 SKU 和月份把订单数量加总成月需求量。

- term: 面板数据
  aliases: [面板]
  plain: 同一批对象在多个时间点上的记录，例如每个 SKU 每个月一行；没有发生业务的月份也补一行，值为 0。

- term: 数据泄漏
  aliases: [泄漏, leakage]
  plain: 训练或评估时用到了“预测那一刻还不可能知道的信息”。结果会好得不真实，一上线就失效。

- term: 特征
  plain: 喂给模型的输入变量，例如“上月需求量”“近 6 月均值”。

- term: 目标变量
  plain: 模型要预测的那个量，例如下个月的需求量。

- term: 滞后特征
  plain: 用过去某个时点的值当输入，例如 lag1 是上个月的需求量、lag3 是三个月前的需求量。

- term: 滚动均值
  plain: 每个时间点往前取固定长度（例如 6 个月）求平均，随时间一格一格往前滚。

- term: 训练集
  aliases: [训练期]
  plain: 模型用来学规律的那部分数据。按时间切分时就是最早的一段。

- term: 验证集
  aliases: [验证期]
  plain: 用来比较不同方法、挑选方案的数据。模型没在上面学过，所以能看出方法好不好。

- term: 最终评估
  aliases: [测试集, holdout, 盲测]
  plain: 专门留到最后、只用一次的数据，用来给出最终结果。平时做决定不能看它，否则等于提前看了考卷。

- term: 时间切分
  plain: 按时间先后切分数据：用过去的数据训练，用之后的数据检验，模拟“站在过去预测未来”。

- term: 交叉验证
  aliases: [逐折]
  plain: 把检验数据分成几段轮流检验，每段叫一折，看结果在不同段上是否稳定，而不是只碰巧在一段上好。

- term: 基线
  plain: 不用训练的简单预测方法，例如直接拿上个月的值当预测。它是模型必须超过的那条线，超不过就说明模型没带来价值。

- term: 线性回归
  plain: 用几个输入变量的加权和来预测结果，权重从历史数据里算出来。简单、算得快、每个权重都能解释。

- term: 最小二乘
  plain: 线性回归求权重的标准做法：让预测值与实际值之差的平方和最小。

- term: MAE
  aliases: [平均绝对误差]
  plain: 平均绝对误差。每个预测与实际差多少（取绝对值）再平均，单位和被预测的量一样，例如“平均每个 SKU 月差 6.6 件”。

- term: RMSE
  plain: 均方根误差。先平方再平均再开方，大误差会被放大，所以它比 MAE 更在意个别错得离谱的预测。

- term: 过拟合
  plain: 模型把训练数据里的偶然波动也当成规律记住了，在训练数据上很准，换成新数据就变差。

- term: 季节性
  plain: 需求随月份规律起伏，例如每年某几个月特别高。看季节性要至少有一两年数据，否则分不清是季节还是偶然。

- term: 故障注入
  aliases: [查错注入]
  plain: 故意把产物改错（删一行、改一个数），看核对程序能不能发现。全部能发现，才说明核对程序本身可靠。

- term: 合成检查
  aliases: [合成数据]
  plain: 用人工造的小数据检验规则。这种数据的正确答案事先就知道，所以能确定规则算得对。

- term: 冻结
  plain: 把某一版产物或规则固定下来，之后只能引用不能改；要改就开新版本，旧版本留着。

- term: 可复现
  aliases: [复现]
  plain: 换个人、换台机器，用同样的代码和同样的数据再跑一次，能得到完全相同的结果。

- term: 轮次
  plain: 同一个步骤的一次尝试（r01、r02……）。返工就开新的一轮，旧的一轮原样保留，方便对比前后差别。

- term: 验收
  plain: 按事先写好的标准逐条核对这一轮的产物，全部通过这一步才算完成。验收报告写给做事的人看，用户报告写给负责人看。

- term: 运行记录
  aliases: [运行]
  plain: 一次执行的完整记录：命令、代码版本、输入数据的哈希、参数、指标、假设与结论。失败和没结论的尝试同样要记，所以能回头看走过的弯路。

- term: 产物
  plain: 一个步骤产生的文件——表、图、模型、报告。每个产物都要写明干什么用，后面的步骤才敢引用它。

- term: 说明卡
  plain: 每一轮的结论卡片（step_card.yaml）：结论、核心数字（处理前 / 变化 / 处理后）、主要操作、例外、产物。带出处的数字由平台从产物重算核对。
