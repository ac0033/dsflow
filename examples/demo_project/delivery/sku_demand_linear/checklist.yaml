# 交付清单（DSFlow）。model / version / reproduce / data / metrics 的数值由平台按模型登记与运行记录生成，
# `dsflow delivery init` 会刷新这些部分；其余由执行 agent 或负责人填写，刷新时保留。写着「待填」的地方都要填完。
model: sku_demand_linear
version: 65cd04dbf982
summary: 交付 SKU 月度需求量预测模型（演示）：用前 3 个月需求量、近 6 月均值和同类目季节系数预测每个 SKU 下个月的需求量，用来回答「下个月哪些 SKU 需要提前备货」
reproduce:
- git checkout 6160f54fc9be018d278a85be133c469483b2b2dd
- uv run dsflow data verify . "steps/04_特征工程/4.1_月度特征/outputs/features.parquet" 63a80b30551ae84afdb3383fc12f7fed56911a000eb561d43d6a97b4a8ba5bd8
- uv run dsflow run 7.1 -- python -m dsflow.tracking.notebook steps/07_模型选择与训练/7.1_线性模型训练/nb_7.1.ipynb
- 'uv run dsflow data verify . "steps/07_模型选择与训练/7.1_线性模型训练/outputs/model.json" 65cd04dbf982f5d143f81dabce68e3277537da6c208fc1d118d70bbc2b6d3c17    # 核对模型文件'
usage:
- 'uv run python -m dsflow.tracking.notebook "steps/11_部署与交付/11.1_交付与预测/nb_11.1.ipynb" --param MONTH=2026-07    # 在演示项目目录运行，输出 steps/11_部署与交付/11.1_交付与预测/outputs/forecast_2026-07.csv'
- 只能预测面板最后一个月（2026-06）紧接的下一个月；要预测更晚的月份，先把新月份的订单依次跑过 1.2、3.1
data:
- name: features
  version: 63a80b30551a
  path: steps/04_特征工程/4.1_月度特征/outputs/features.parquet
  sha256: 63a80b30551ae84afdb3383fc12f7fed56911a000eb561d43d6a97b4a8ba5bd8
  rows: 54000
  columns: 12
metrics:
- name: MAE_验证
  value: 6.6481
  baseline: 最好的基线（近 6 月均值）6.9544，低 4.4%
  scope: 验证期 2026-01～03 共 9,000 个 SKU 月，每个 SKU 月一个绝对误差取平均；模型只用训练期拟合
- name: MAE_最终评估
  value: 6.6127
  baseline: 同期近 6 月均值基线 6.8679，低 3.7%
  scope: 最终评估期 2026-04～06 共 9,000 个 SKU 月；模型用训练期 + 验证期拟合，只评估一次
- name: MAE_最终评估_近6月均值基线
  value: 6.8679
  baseline: ''
  scope: 同一最终评估期，直接拿近 6 月均值当预测的误差，作为对照
applicability:
  scope:
  - 已有 6 个月以上订单历史的 SKU，按月预测紧接的下一个月的需求量（正数量合计，退货行不计入）
  - 近 6 月均值在 10 以上的 SKU 效果最明显：最终评估期模型 MAE 比基线低 1.36～5.97（error_by_level.csv）
  not_for:
  - 订单历史不足 6 个月的新 SKU
  - 按天、按周的需求量；隔一个月以上的预测
  - 金额预测（模型只预测数量）
  data_period: 订单下单时间 2024-07 至 2026-06；模型拟合用 2025-01 至 2026-03
  known_weaknesses:
  - 近 6 月均值 0～5 的 SKU 月（最终评估期 2,991 个，占 33%）模型 MAE 5.5774，不如近 6 月均值基线 5.0269；5～10 的两者持平
  - 需求量为 0 的 SKU 月占 22.73%，单个 SKU 的月度误差平均约 6.6，而平均月需求量约 7.6
  - 季节系数在训练期里每个自然月只有 1～2 次观测
  - 大促、集中采购等一次性大单没有单独处理
monitoring:
- metric: 每月实际需求量出来后，上个月预测的 MAE（SKU 月粒度）
  threshold: 连续 2 个月高于 7.9（最终评估期 MAE 6.61 的 1.2 倍）
  frequency: 每月初
  action: 回到 7.1 用最新月份重新训练，登记为新版本，交付清单重新核对
- metric: 同期近 6 月均值基线的 MAE
  threshold: 模型 MAE 连续 2 个月不低于基线
  frequency: 每月初，与上一项一起算
  action: 暂停使用模型，改用近 6 月均值出预测，回到 7.1 查原因
- metric: 提示提前备货的 SKU 数
  threshold: 比上个月变化超过一半
  frequency: 每月出预测时
  action: 抽查变化最大的 SKU 的近几个月订单，确认不是数据问题
deployment: 待定
artifacts:
- path: steps/07_模型选择与训练/7.1_线性模型训练/outputs/model.json
  purpose: 模型文件
  kind: model
- path: steps/07_模型选择与训练/7.1_线性模型训练/outputs/final_metrics.json
  purpose: 验证期与最终评估期的 MAE
  kind: table
- path: steps/07_模型选择与训练/7.1_线性模型训练/outputs/error_by_level.csv
  purpose: 最终评估期按近 6 月均值分组的误差
  kind: table
- path: steps/11_部署与交付/11.1_交付与预测/nb_11.1.ipynb
  purpose: 使用入口（换月份就是下个月的清单）
  kind: other
- path: steps/11_部署与交付/11.1_交付与预测/outputs/forecast_2026-07.csv
  purpose: 2026-07 各 SKU 预测与提前备货标记
  kind: table
open_items:
- 提前备货规则（预测需求量 ≥ 近 3 月均值 × 1.3 且 ≥ 10）是演示用规则，需业务确认；按这条规则，近期需求量高的 SKU 几乎不会被标出（见 11.1 说明卡）
- 部署方式待定，目前只能在项目环境里用命令行出预测
