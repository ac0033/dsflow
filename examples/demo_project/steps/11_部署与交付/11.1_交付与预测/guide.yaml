# 11.1 交付与预测 · notebook 导读
step: "11.1"
notebook: nb_11.1.ipynb

brief:
  background: 7.1 的模型已经登记。这一步把它用起来：给下个月出预测，并筛出要提前备货的 SKU。
  question: 模型做完了，日常怎么用？下个月哪些 SKU 要提前备货？
  answer: 给全部 SKU 出了下个月预测，并按规则筛出要提前备货的那批。
  can_continue: true
  did: 载入登记的模型算出预测，再用备货规则过一遍，输出清单。
  result: 下个月各 SKU 的预测与备货清单写入 forecast_2026-07.csv，业务可以直接使用。
  next: 交付清单已经齐全；验收与交付由你确认，部署方式待定。

parts:
  - question: 怎么用模型出下个月的预测？
    answer: 读模型文件、给每个 SKU 添一行下个月、用同一套函数算特征、代入模型。
    meaning: 关键是“同一套函数”：训练时怎么算特征，预测时就得怎么算，否则模型看到的输入根本不是它学过的东西。
    cells:
      - cell: 2
        title: 参数格：预测哪个月、备货规则怎么定
        what: 这一格只有三个参数：预测月份，以及提前备货的两个阈值。
        why: 换月份重跑就是下个月的清单，不用改代码——运行时加 --param MONTH=2026-08 即可。阈值也放在这里，业务改规则不用碰逻辑。
        read: 这一格没有输出，它只是给下面的代码提供取值。
      - cell: 3
        title: 先看清楚拿的是哪个模型
        what: 读模型文件和面板，打印模型的类型、用的特征、拟合数据的时间范围，以及面板的最后一个月。
        why: 模型文件里记着它是拿哪段数据、按什么特征训练的。用之前先看一眼，免得拿错版本或者超出它的适用范围。
        read: 模型是线性回归（预测值截到 0 以上），特征 lag1、lag2、lag3、mean6、season，拟合数据 2025-01 至 2026-03；面板最后一个月是 2026-06，本次预测 2026-07，正好紧接着——这正是模型的适用范围。
      - cell: 4
        title: 算特征、出预测、标出要备货的 SKU
        what: 给每个 SKU 添一行下个月，用训练时同一套函数算特征，代入模型得到预测需求量，再按规则打上提前备货标记。
        why: 预测值本身是个数字，业务要的是“该做什么”。所以要有一条写死的规则把数字变成清单，而不是让人对着几千行自己判断。
        read: 预测值最高的十个 SKU 在 20.18 到 14.40 之间。注意 SKU00302 预测 15.07、近 3 月均值 9.666667，被标成提前备货；而 SKU00420 预测 20.18、近 3 月均值 24，没有被标——它本来就卖得多，不算“突然变多”。

  - question: 哪些 SKU 值得提前备货？凭什么是这 42 个？
    answer: 预测需求量既要明显高于近 3 月均值，又要够大，两条同时满足才提示，共 42 个。
    meaning: 规则决定了清单的长短和实用性。阈值是演示用的，真要上线得业务定——这一条写在交付清单的遗留问题里。
    cells:
      - cell: 5
        title: 记下用了哪个模型、什么规则
        what: 把模型文件路径和版本、预测月份、备货规则记成运行参数，登记指标和产物，打印备货清单的前几行。
        why: 下个月复盘“上次为什么提示这些 SKU”，靠的就是这条记录：模型版本和规则都在里面，不用凭记忆。
        read: 预测 SKU 数 3000、提前备货 42 个、预测需求量合计 23077.96。备货清单里 SKU00302 预测 15.07 对近 3 月均值 9.666667；SKU02321 预测 13.12 对 2.666667——后者最近几乎没订，下个月预测明显抬头，属于典型的“要提前准备”。
      - cell: 6
        title: 写下结论
        what: 把预测规模、合计和备货数量写成一句结论，结束这次运行。
        why: 这句话会进流程图和看板，也是交付清单里“使用入口跑通了”的证据。
        read: 2026-07 预测 3,000 个 SKU，需求量合计 23,077.96，提示提前备货 42 个。

terms:
  - term: 提前备货
    plain: 预测需求量明显高于近 3 月均值、并且量不算小的 SKU，需要提前准备库存。这里的“明显”和“不算小”由参数格里的两个阈值定。
  - term: 模型版本
    plain: 模型文件内容的哈希前 12 位。文件内容一变版本就变，所以能确定用的到底是不是同一个模型。

cannot_say:
  - 提前备货的阈值（1.3 倍、≥ 10）是演示用的，业务上合不合适没有验证过。
  - 只能预测紧接面板最后一个月的下一个月；要预测更远的月份，得先把新数据跑过 1.2 和 3.1。
  - 预测的是数量，不是金额；也没有考虑现有库存、在途和最小起订量。
