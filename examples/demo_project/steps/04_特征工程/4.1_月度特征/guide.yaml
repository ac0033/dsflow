# 4.1 月度特征 · notebook 导读
step: "4.1"
notebook: nb_4.1.ipynb

brief:
  background: 3.1 铺好了面板，但里面只有需求量本身。模型需要输入，这一步造出来，同时守住不用未来信息。
  question: 模型靠什么判断下个月要多少？怎么保证没用到那时还不知道的信息？
  answer: 造了 5 个只看过去的特征；历史不足 6 个月的行整行删掉。
  can_continue: true
  did: 用往前推的窗口算滞后值和均值，再乘上只用训练期估的季节系数。
  result: 5 个只看过去的特征写入 features.parquet，历史不足 6 个月的行已经删除，可以直接用于训练。
  next: 6.1 先用不训练的笨办法定一条线，7.1 再看模型能不能超过它。

parts:
  - question: 特征是怎么造的？为什么只能用“这个月之前”的数？
    answer: 每个特征都只取该月之前的需求量；季节系数只用训练期估计。
    meaning: 这是整个项目最容易出事、也最难发现的地方。一旦用了当月或以后的信息，评估分数会好得不真实，上线后立刻打回原形。
    cells:
      - cell: 2
        title: 季节系数只用训练期估计
        what: 读面板，只取训练期的行来估计各类目每个自然月的季节系数。
        why: 季节系数如果用全部数据估计，就把验证期和最终评估期的信息漏给了模型——这是最典型的数据泄漏。宁可估得粗一点，也不能提前看答案。
        read: 覆盖 3 个类目；打印的样例是 MRO 工业品 1 月 0.9643、2 月 0.9746、3 月 0.9331，都在 1 附近，说明年初不是这个类目的旺季。
      - cell: 3
        title: 算历史特征，再删掉历史不够的行
        what: 给每个 SKU 按月份排好，算前 1～3 月需求量、近 3 月和近 6 月均值，再乘季节系数得到 season。
        why: 头几个月没有足够的历史，近 6 月均值必然是空的。留着这些行、把空值当 0，等于告诉模型“过去半年没有需求”，那是假的。
        read: 特征表 72,000 行 → 54,000 行，删掉历史不足 6 个月的 18,000 行。前三行是 SKU00001 的 2025 年前三个月：mean3 11.666667、mean6 14.666667、季节系数 1.0290、season 12.005000。
        lines:
          - line: 1
            note: 两个函数都在项目的 src/demo_lib.py 里，7.1 训练和 11.1 预测用的是同一套定义，免得两边算法不一致。
          - line: 3
            note: 近 6 月均值算不出来的行整行删掉，而不是填 0。

  - question: 删完还剩多少？够训练吗？
    answer: 训练 36,000 行、验证 9,000 行、最终评估 9,000 行，少掉的全在训练期最早的半年。
    meaning: 验证期和最终评估期一行没少，所以这次删行不会影响后面比较的口径。
    cells:
      - cell: 4
        title: 存下季节系数表，登记特征表
        what: 把季节系数写成 season_table.json，把特征表登记为一份新的数据版本，记下指标，数一数三段各剩多少行。
        why: 季节系数要单独存，因为 11.1 预测时还要用同一份——重新估一遍就等于换了模型。
        read: 训练 36000、验证 9000、最终评估 9000。
      - cell: 5
        title: 写下结论
        what: 把特征行数、删掉的行数和三段的行数写成一句结论，结束这次运行。
        why: 这句话会出现在流程图节点和看板上，是别人看这一步的第一眼。
        read: 特征 54,000 行，删除历史不足 6 个月的 18,000 行；训练 36,000、验证 9,000、最终评估 9,000。

terms:
  - term: lag1
    plain: 上个月的需求量（lag 是“滞后”）。lag2、lag3 就是前两个月、前三个月的需求量。
  - term: mean6
    plain: 近 6 个月的平均需求量，不含当月。mean3 同理，是近 3 个月的平均。
  - term: season
    plain: 这里指“近 3 月均值 × 同类目季节系数”这个特征：把最近的水平按当月的季节特点放大或缩小。

cannot_say:
  - 特征只用了需求量的历史和类目季节系数，没有用价格、促销、供应商、库存等信息。
  - 删掉 18,000 行意味着新 SKU 上架的头 6 个月没法预测，这是方法本身的边界。
  - 季节系数只用训练期估计；如果后来季节形态变了，这个特征会失真，要靠监控发现。
