# 2.1 需求分布探索 · notebook 导读
step: "2.1"
notebook: nb_2.1.ipynb

brief:
  background: 1.2 的订单可以用了。造特征之前先看需求本身有没有规律——有季节性，才值得把它做成特征。
  question: 各类目的需求有没有季节规律？「需求量」这个词到底怎么算？
  answer: 有季节性，三个类目的高峰月各不相同；需求量口径定死为正数量合计。
  can_continue: true
  did: 按类目、按月汇总需求量，算出每个类目的季节系数。
  result: 按月按类目的需求量汇总写入 monthly_by_category.csv，每个类目的季节系数写入 seasonality.csv，4.1 直接用它造特征。
  next: 4.1 把季节系数做成特征，并且只用训练期估计，避免用到未来的信息。

parts:
  - question: “需求量”是怎么算出来的？
    answer: 清洗后的订单去掉 361 行退货，按类目和月份把数量加总，得到 72 行月度需求量表。
    meaning: 这个口径要一直用到最后。口径不统一，后面所有的比较、所有的误差都失去意义。
    cells:
      - cell: 2
        title: 定死口径，把订单汇总成月度需求量
        what: 读清洗后的订单，去掉退货行，按类目和月份把数量加总，存成 monthly_by_category.csv。
        why: 需求量必须有一个写死的算法：正数量合计、退货不计入。写在代码里而不是写在文档里，才不会各人一套。
        read: 退货 361 行不计入；月度需求量表 72 行 = 3 个类目 × 24 个月。前几行能看到 MRO 工业品 2024-07 是 6719、2024-10 是 8996，同一个类目不同月份差得不小。

  - question: 季节性有多强？高峰在几月？
    answer: 三个类目高峰月不同：MRO 工业品 10 月 1.307、办公通用物资 3 月 1.1769、电力物资 12 月 1.4864。
    meaning: 高峰月不同，意味着不能用一条全局的“旺季规则”备货；按类目分开看才有意义。
    cells:
      - cell: 3
        title: 除以自己的平均值，三个类目才能放在一起比
        what: 算每个类目每个自然月的季节系数（该月平均需求量 ÷ 该类目全年平均），存成 seasonality.csv，并挑出每个类目系数最高的月份。
        why: 直接比月度需求量，大类目永远比小类目高，看不出季节。除以各自的平均值之后，数字就变成“相对自己是高还是低”，可以横着比。
        read: 系数 1 表示“和自己全年平均一样”。高峰：MRO 工业品 10 月 1.3070、办公通用物资 3 月 1.1769、电力物资 12 月 1.4864——电力物资的旺季最突出。
      - cell: 4
        title: 把高峰系数记成指标
        what: 把三个类目的高峰系数和退货行数记为这次运行的指标，登记两份产物，写结论。
        why: 记成指标之后，以后数据更新重跑，季节形态有没有变会直接对比出来，不用人去翻两版 CSV。
        read: 结论把三个类目的高峰月和系数并排写出来，和上面表里的数字一致。

terms:
  - term: 自然月
    plain: 1 到 12 月这个“月份”本身，不区分年份。按自然月汇总，才能看出每年都会重复出现的规律。
  - term: 季节系数
    plain: 某类目某个自然月的平均需求量 ÷ 该类目所有月份的平均需求量。大于 1 是旺季，小于 1 是淡季。

cannot_say:
  - 两年数据里每个自然月只出现过两次，季节系数只能当粗略参考，不能当成稳定结论。
  - 季节系数是按类目算的，单个 SKU 的旺季可能和所属类目完全不同。
  - 这一步只看了数量，没有看金额，也没有区分大单和日常采购。
