# 1.2 订单清洗 · notebook 导读
step: "1.2"
notebook: nb_1.2.ipynb

brief:
  background: 1.1 数出了四类毛病并列了清单。这一步按清单逐项处理，后面所有步骤用的都是这一步的产物。
  question: 1.1 数出来的毛病，哪些该删、哪些只做标记？删完账还对得上吗？
  answer: 只删完全重复和下单时间在未来两类；退货和金额未知只打标记，账对得上。
  can_continue: true
  did: 按问题清单逐项处理，每删一类都记下删了多少、金额差多少。
  result: 清洗后的订单写入 orders_clean.parquet，每删一类的行数与金额差记录在 row_ledger.csv 里，后面每一步都直接读这张表。
  next: 进 2.1 看季节性、3.1 切时间，两边用的都是这份清洗后的订单。

parts:
  - question: 删了哪些行？删完账还对得上吗？
    answer: 只删两类：完全重复 1000 行、下单时间在未来 2 行。121000 − 1000 − 2 = 119998，账是平的。
    meaning: 删行是不可逆的动作。留一张台账，任何时候都能回答“为什么少了这些行”，而不是只给一个结果数字。
    cells:
      - cell: 2
        title: 从“处理前是多少”开始
        what: 读原始订单，登记为这次运行的输入，打印清洗前的行数。
        why: 每一步都先说清处理前的数，最后才有得对账。这个数要和上一步（1.1）报的对得上。
        read: 清洗前 121,000 行，与 1.1 数出来的完全一致。
      - cell: 3
        title: 删两类行，并记成一张台账
        what: 先删完全重复的行，再删下单时间晚于数据最后一个月的行，把每一步删了多少记成 row_ledger.csv。
        why: 台账就是这一步的账本：原始 − 删除 = 清洗后。有了它，别人不用重跑代码也能核对这一步有没有多删。
        read: 台账四行——原始 121000、删除完全重复行 1000、删除未来日期 2、清洗后 119998。121000 − 1000 − 2 = 119998，对得上。
        lines:
          - line: 1
            note: 所有字段都相同才算完全重复，不是只看订单号；只看订单号会把同一张订单的不同 SKU 误删。
          - line: 10
            note: 单元格最后一行只写变量名，notebook 就把这张表显示出来——下面那张表就是它。
        data:
          title: 这张台账本身
          note: 本步的产物，平台现取。
          frames:
            - label: 行数台账
              file: steps/01_数据预处理/1.2_订单清洗/outputs/row_ledger.csv
              columns: [处理, 行数]
              limit: 5
              mark:
                columns: [行数]
              caption: 从原始到清洗后，每一步减了多少都记在这里，加减能对上。

  - question: 退货和金额未知为什么不删？
    answer: 因为它们是真实发生的业务。这一步只加标记列：退货 361 行、金额未知 636 行。
    meaning: 删掉它们，金额和数量的合计就再也和业务系统对不上了。打成标记，哪一步要排除、哪一步要保留，各自决定、各自说明。
    cells:
      - cell: 4
        title: 统一商品名称写法，给特殊情况打标记
        what: 把商品名称的全角半角和首尾空格统一，再加三列：下单月份、是否退货、金额未知。
        why: 名称写法不统一会把同一件商品的需求拆成几份；而退货和金额未知不能删，只能标出来。标记不改原值，原来的数量、金额一个都没动。
        read: 商品名称规范化 3,703 行；退货行 361；金额未知行 636；清洗后订单行 119,998——和台账里的数一致。
      - cell: 5
        title: 存成 parquet 并登记为新版本数据
        what: 把清洗后的订单存成 orders_clean.parquet，登记为一份新的数据版本，记下指标和台账产物，写结论。
        why: 登记之后，平台会自动算出“处理前 → 处理后”的行列变化，后面的步骤也能按名字引用这份数据，而不是各自去拼路径。
        read: 结论一句话说清：删了什么、留了什么、哪些只是打了标记。

terms:
  - term: 标记列
    plain: 不改原来的值，只加一列 True / False 说明这一行属于哪种情况。后面用不用它，由各步自己决定并说明。
  - term: 行数台账
    plain: 记录“每一步删了多少行”的小表。原始 − 各项删除 = 剩余，是对账最基本的凭据。
  - term: 数据版本
    plain: 一份产物按内容哈希登记下来的一个版本。内容变了就是新版本，旧版本仍然留着，所以能回头对比。

cannot_say:
  - 删掉的 1,002 行只按“所有字段完全相同”和“日期在未来”两条规则判断，没有做更复杂的近似重复识别。
  - 商品名称统一的是写法，不是把不同商品合并；SKU 编码一个都没有动。
  - 金额未知的 636 行仍然留在数据里，做任何金额统计时都要单独处理。
