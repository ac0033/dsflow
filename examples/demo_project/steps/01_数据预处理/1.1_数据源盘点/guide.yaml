# 1.1 数据源盘点 · notebook 导读
step: "1.1"
notebook: nb_1.1.ipynb

brief:
  background: 手上有订单明细和 SKU 目录两份原始数据，还没人看过。动手之前得先知道它们长什么样。
  question: 手上这两份原始数据能不能拿来预测需求？有哪些毛病？
  answer: 能用，但要先修四类毛病：重复行、金额缺失、数量为负、下单时间在未来。
  can_continue: true
  did: 逐个字段看了一遍，把毛病数清楚，再对照 SKU 目录确认两份数据接得上。
  result: 四类毛病的行数与金额写入 field_inventory.csv，1.2 按这张清单逐项清洗。
  next: 1.2 按这张问题清单逐项清洗，删什么留什么都对着这些数字核。

parts:
  - question: 这两份数据各是什么？一行代表什么？
    answer: 订单明细 121,000 行 × 12 列，一行是一个订单号下的一个 SKU；SKU 目录 3,000 行 × 7 列。
    meaning: “一行代表什么”定错，后面所有的量都会错一个量级——比如把订单行数当成订单张数报上去。
    cells:
      - cell: 2
        title: 读进两份原始数据，并登记为这次运行的输入
        what: 读订单明细和 SKU 目录，把这次运行用到的两份文件登记下来，然后打印行数、列数和字段名。
        why: 先确认“一行代表什么”。订单明细一行是一个订单号下的一个 SKU，不是一张订单；这一点定下来，后面的数字才能互相印证。
        read: 订单明细 121,000 行 × 12 列，SKU 目录 3,000 行 × 7 列；订单明细的字段是订单号、下单时间、采购单位、类目、SKU、商品名称、品牌、数量、单价、金额、渠道、省份。
        lines:
          - line: 17
            note: 从这里开始就算一次“运行”：命令、代码版本、输入数据的哈希、指标和结论都会记在一起，将来能原样重跑。
          - line: 19
            note: 订单号和 SKU 强制按文本读，免得前导 0 被当成数字丢掉。
          - line: 21
            note: 登记输入只记路径和内容哈希，原始数据一个字节都不会动。
        data:
          title: 订单明细长什么样
          note: 平台现取前 4 行，不建缓存。
          frames:
            - label: 原始订单
              file: data/raw/orders.csv
              columns: [订单号, 下单时间, 类目, SKU, 商品名称, 数量]
              limit: 4
              mark:
                columns: [订单号, SKU]
              caption: 一行是一个订单号下的一个 SKU，不是一张订单——这一点定错，后面所有的量都会错一个量级。
      - cell: 3
        title: 逐个字段看一眼：类型、缺失、有多少种取值
        what: 对订单明细的每一列统计类型、非空数、缺失数、不同值个数和一个真实示例，存成 field_inventory.csv。
        why: 一眼分出哪些是标识字段（取值很多）、哪些是分类字段（取值很少）、缺失集中在哪里。这比逐行翻数据快得多，也不会漏。
        read: 订单号有 120000 个不同值，比 121000 行少——说明一张订单下可以有多个 SKU；类目只有 3 种、品牌 8 种、省份 6 种，都是分类字段；金额非空 120359、缺失 641，是唯一有缺失的列；SKU 有 3000 个不同值，正好等于目录里的 SKU 数。

  - question: 有哪些毛病？各有多少行？
    answer: 完全重复 1000 行、金额缺失 641 行、数量为负 364 行、未来日期 2 行、名称写法不规范 3733 行。
    meaning: 清洗之前先把“该动多少行”数清楚，1.2 做完才有得对账；否则删多删少都没人知道。
    cells:
      - cell: 4
        title: 把每一类毛病数出确切的行数
        what: 逐项数出这一步关心的质量问题，写成 quality_issues.json，同时登记为这次运行的指标。
        why: 指标记进运行记录后，下次数据更新重跑，同样的口径会再算一遍——问题是变多了还是变少了，一眼能看出来。
        read: 完全重复行 1000；金额缺失 641；数量为负 364（都是退货）；未来日期 2；商品名称含首尾空白或全角字符 3733；订单中不在目录的 SKU 是 0，说明两份数据的编码对得上。
        lines:
          - line: 8
            note: 数据最后一个月是 2026-06，下单时间晚于它的一定是录入错误。
          - line: 9
            note: 先把全角字符换成半角、去掉首尾空格，换算前后不一样的就是写法需要统一的行。
      - cell: 5
        title: 写下结论，结束这次运行
        what: 把这一步的结论写进运行记录并结束运行。
        why: 结论跟着运行走。下次重跑时，同一句结论下的数字有没有变，平台会直接对比给你看。
        read: 结论复述了四类问题的行数，全部留给 1.2 处理——这一步只看不改。

terms:
  - term: 不同值
    plain: 一列里有多少种不同的取值。标识类字段（订单号、SKU）很多，分类字段（类目、品牌）很少，差别很大说明字段的性质不同。
  - term: 运行
    plain: 一次执行的完整记录：命令、代码版本、输入数据的哈希、参数、指标、结论都记在一起，所以能原样重跑、能互相对比。
  - term: 产物
    plain: 这一步产生的文件（表、图、模型、报告）。每个产物都要写明它是干什么用的，后面的步骤才敢引用。

cannot_say:
  - 这一步没有改动任何数据，所有问题都还原样留在原始文件里。
  - “不在目录的 SKU 是 0”只说明编码对得上，不说明目录里的品牌、类目填得对。
  - 字段的不同值个数不能当成业务上的真实种类数：同一个东西写法不同，就会被数成两种。
