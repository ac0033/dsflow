# 7.1 线性模型训练 · notebook 导读
step: "7.1"
notebook: nb_7.1.ipynb

brief:
  background: 6.1 定出了基线：近 6 月均值。这一步训练线性模型，看它能不能打败这条线。
  question: 线性模型能不能打败「近 6 月均值」这条线？在哪些 SKU 上反而更差？
  answer: 打败了，但赢得不多；低需求的 SKU 上反而输给基线。
  can_continue: true
  did: 用训练期拟合线性模型，在验证期和最终评估期各比一次，再分组看。
  result: 训练好的线性模型登记为候选版本，分组误差写入 error_by_level.csv，11.1 直接载入它计算预测。
  next: 11.1 用这个模型出下个月预测；模型登记为候选，验收与交付由你确认。

parts:
  - question: 模型是什么样的？怎么和基线比？
    answer: 最小二乘线性回归，在训练期定权重、在验证期比：MAE 6.6481，低于基线 6.9544。
    meaning: 线性模型的每个权重都能解释，出了问题能查到是哪个特征带偏的；这在要向业务解释的场景里比“更准一点”更重要。
    cells:
      - cell: 2
        title: 参数格：这一次用哪些特征
        what: 这一格只有两个参数——用哪些特征、是不是定稿那一次。
        why: 特征组合一共试了四次，每次是一条独立的运行记录。参数单独放一格，换组合时不用改代码，也能让平台把四次横着比。
        read: 这一格没有输出，它只是给下面的代码提供取值；运行时加 --param FEATURES=lag1 就能换成另一组。
      - cell: 3
        title: 按划分取三份数据，记下这次的参数
        what: 读特征表，按划分切成训练、验证、最终评估三份，把本次用的特征和模型类型记成运行参数。
        why: 参数记进运行记录，四次尝试才能横着比——不然过两天没人记得清哪一次用了哪些特征。
        read: 训练 36,000 行、验证 9,000 行、最终评估 9,000 行；本次特征 lag1、lag2、lag3、mean6、season。
      - cell: 4
        title: 拟合、算验证期误差、和基线比
        what: 在训练期拟合线性回归，在验证期算 MAE，读 6.1 定下的基线来对照。
        why: 只在训练期拟合、只在验证期比较，是为了让“比较”这件事本身不受模型影响；最终评估期这时候一眼都不能看。
        read: 三个 lag 的系数是负的，mean6 0.347184、season 0.815466 是正的——模型主要看「最近半年的平均水平 + 季节」，把单月的忽高忽低当成要往回拉的波动。验证期 MAE 6.6481，低于最好的基线 6.9544。

  - question: 定稿模型在最终评估期表现如何？对谁有用、对谁没用？
    answer: 最终评估期 6.6127 对基线 6.8679；需求越大赢得越多，最低的那一组反而输。
    meaning: 平均数会把结构性差异藏起来。这张分组表决定了交付时“适用范围”和“不适用范围”怎么写。
    cells:
      - cell: 5
        title: 重新拟合，最终评估只评一次
        what: 定稿这次（FINAL=True）用训练期加验证期重新拟合，在最终评估期算一次 MAE，存下模型文件和指标。
        why: 最终评估期是留到最后的一次性考卷。反复在它上面试、挑一个最好的报出来，这个数字就不再可信了。
        read: 最终评估期 MAE 6.6127，同期近 6 月均值基线 6.8679——和验证期的结论方向一致，说明验证期的判断没有跑偏。
      - cell: 6
        title: 按需求量高低分组，看模型赢在哪
        what: 把最终评估期按近 6 月均值分成四组，比较模型和基线的 MAE，再把模型文件登记为一个版本。
        why: 一个平均数可能掩盖“在最需要预测的大 SKU 上其实更差”。分组看，才能说清这个模型该用在谁身上。
        read: 0～5 组 2991 个 SKU 月，模型 5.5774 差于基线 5.0269；5～10 组 3675 个，6.7319 与 6.7303 基本持平；10～20 组 2166 个，7.6423 好于 9.0023；20 以上 168 个，9.1621 好于 15.1339。需求量越大，模型赢得越多。
      - cell: 7
        title: 写下结论，模型登记为候选
        what: 把验证期、最终评估期的对照和模型版本写成一句结论，结束这次运行。
        why: 模型只登记为“候选”。验收和交付要由人确认并写明理由，脚本不替你决定。
        read: 结论把两段时间的模型与基线数字并排写出来，并带上模型版本号——那串字符是模型文件内容的哈希，内容一变版本就变。

terms:
  - term: 系数
    plain: 每个特征在加权求和里乘的那个数。正的表示该特征越大预测越大，负的相反，绝对值越大影响越强。
  - term: 截距
    plain: 所有特征都等于 0 时的预测起点。
  - term: 定稿
    plain: 特征组合比完之后选定的那一次训练。只有定稿这次才用训练期加验证期重新拟合，并动最终评估期。

cannot_say:
  - 模型只比基线好一点，值不值得用还要看维护成本；这一步不做这个判断。
  - 最终评估期只评这一次，这个数字不能反复刷新，也不能拿去挑特征。
  - 低需求 SKU（近 6 月均值 0～5）不如基线，必须写进交付清单的不适用范围。
  - 线性回归只描述了这些特征与需求量之间的关系，不代表因果。
