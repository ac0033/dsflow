step: "7.1"
headline: 最终模型验证期 MAE 6.6481，比最好的基线（近 6 月均值）6.9544 低 4.4%；最终评估期 MAE 6.6127，比同期近 6 月均值基线 6.8679 低 3.7%；登记为 sku_demand_linear 65cd04dbf982（候选），等你验收
can_continue: true
core_numbers:
  - label: 验证期 MAE
    before: 6.9544
    change: -0.3063
    after: 6.6481
    scope: 处理前是最好的基线（近 6 月均值）；验证期 2026-01～03 共 9,000 个 SKU 月；模型只用训练期拟合
    source: "outputs/final_metrics.json#/MAE_验证"
  - label: 最终评估期 MAE
    before: 6.8679
    change: -0.2552
    after: 6.6127
    scope: 处理前是同期近 6 月均值基线；最终评估期 2026-04～06 共 9,000 个 SKU 月；模型用训练期 + 验证期拟合，只评估一次
    source: "outputs/final_metrics.json#/MAE_最终评估"
  - label: 近 6 月均值 0～5 的 SKU 月：模型 MAE
    before: 5.0269
    change: 0.5505
    after: 5.5774
    scope: 处理前是同组的近 6 月均值基线；最终评估期 2,991 个 SKU 月（占 33%）
    source: "outputs/error_by_level.csv#sql:SELECT 模型MAE FROM data WHERE 近6月均值分组 = '0～5'"
operation: 训练期拟合线性回归，在验证期比较 4 组特征（每组一次运行）；选定最后一组后，用训练期 + 验证期重新拟合，只在最终评估期评估一次，保存模型文件并登记为候选。
exceptions:
  - 需求量低的 SKU 上模型不如基线：近 6 月均值 0～5 的 2,991 个 SKU 月，模型 MAE 5.5774 高于基线 5.0269；5～10 的两者持平（6.7319 与 6.7303）。整体的提升全部来自近 6 月均值 10 以上的 SKU
  - 提升不大：每个 SKU 月平均仍差约 6.6，而平均月需求量约 7.6
artifacts:
  - {path: outputs/model.json, purpose: 最终模型：特征、系数、只用训练期估计的季节系数, kind: model}
  - {path: outputs/final_metrics.json, purpose: 最终模型在验证期与最终评估期的 MAE，及同期最好的基线, kind: table}
  - {path: outputs/error_by_level.csv, purpose: 最终评估期按近 6 月均值分组的误差：模型与近 6 月均值基线, kind: table}
why: 基线只看历史平均；线性模型可以同时用最近几个月、长期水平和季节，看能不能比最好的基线更准。
invariants:
  - 最终评估期只评估一次，没有根据它回头改特征
concentration: 提升集中在近 6 月均值 10 以上的 SKU：10～20 组 7.6423 对基线 9.0023，20 以上组 9.1621 对基线 15.1339
can_say:
  - 线性模型在验证期和最终评估期整体都比最好的基线准
  - 季节调整特征带来的提升最大：4 组特征的验证期 MAE 依次是 6.9505、6.8965、6.7959、6.6481
  - 模型把近期需求量高的 SKU 往回拉是有依据的：近 6 月均值 20 以上的 168 个 SKU 月，实际平均需求量 12.14、模型平均预测 13.75，都远低于它们的近 6 月均值
cannot_say:
  - 还不能说模型对需求量低的 SKU 有用：那一组它不如近 6 月均值
  - 还不能说换成更复杂的模型会更好，本项目没有试
next: 11.1 用这个模型出 2026-07 预测并写交付清单；你在「模型与交付」页决定是否验收。可以考虑近 6 月均值低于 5 的 SKU 直接用近 6 月均值
examples:
  - title: SKU00302 的 2026-07 预测怎么来的
    input: 前 3 个月需求量 8、2、19（近 3 月均值 9.67），近 6 月均值 27.83，办公通用物资 7 月季节系数 1.0043
    rule: 预测 = 4.870813 − 0.303927×8 − 0.304732×2 − 0.307006×19 + 0.365701×27.83 + 0.915698×（9.67×1.0043），小于 0 时取 0
    output: 15.07；前 3 个月的负系数与季节调整特征几乎抵消，预测主要由 4.87 + 0.37 × 近 6 月均值决定
    artifact: outputs/model.json
    real: true
