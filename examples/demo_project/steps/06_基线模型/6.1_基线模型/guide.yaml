# 6.1 基线模型 · notebook 导读
step: "6.1"
notebook: nb_6.1.ipynb

brief:
  background: 4.1 的特征表可以训练了。但在做模型之前得先知道什么都不做能到什么水平，否则无从判断值不值。
  question: 做模型之前先问一句：什么都不做能到什么水平？
  answer: 近 6 月均值最好，验证期 MAE 6.9544，这就是模型要打败的线。
  can_continue: true
  did: 拿三种不用训练的笨办法在验证期各算一遍误差。
  result: 三种笨办法在验证期的误差记录进运行记录，近 6 月均值的 MAE 6.9544 成为后面要超过的那条线。
  next: 7.1 训练线性模型，验证期 MAE 必须低于这条线才算有价值。

parts:
  - question: 三种笨办法各差多少？
    answer: 上月值 8.7692、近 3 月均值 7.4249、近 6 月均值 6.9544——平均得越久越准。
    meaning: 这个结论本身就有业务含义：单月需求波动大，最近半年的平均水平才代表这个 SKU 的真实节奏。
    cells:
      - cell: 2
        title: 三种不用训练的预测，各算一个 MAE
        what: 取验证期的行，分别拿上月值、近 3 月均值、近 6 月均值当预测，各算一个平均绝对误差。
        why: 基线要笨到没有争议：不训练、不调参、任何人都能复现。它代表“零成本方案”的水平，模型的价值就是超过它的那部分。
        read: 验证期 9,000 个 SKU 月：上月值 8.7692、近 3 月均值 7.4249、近 6 月均值 6.9544。往回看得越久，误差越小。
      - cell: 3
        title: 按月份再算一遍，看结论稳不稳
        what: 把验证期的三个月拆开，各自再算一次三种方法的 MAE。
        why: 只看一个总数，分不清是“确实更好”还是“某一个月特别好把平均拉了上去”。
        read: 三个月里近 6 月均值都最好（6.9283、6.9061、7.0287），名次没有反转，说明这个结论不是某个月的偶然。

  - question: 那条线定在哪？
    answer: 定在 6.9544（近 6 月均值），并写成文件让 7.1 直接读。
    meaning: 把线写进文件而不是写进报告，7.1 比较时就不会用错口径，也不必靠人转述。
    cells:
      - cell: 4
        title: 选出最好的基线，落成文件
        what: 选出 MAE 最小的方法，把三项指标、逐月结果和“最好的基线”一起写进 baseline_metrics.json。
        why: 7.1 要和同一个基线比、在同一段时间比。口径写死在文件里，比较才成立。
        read: 结论：验证期 9,000 个 SKU 月，最好的基线是近 6 月均值，MAE 6.9544。

terms:
  - term: 绝对误差
    plain: 预测和实际差多少，取绝对值（不分高估还是低估）。把每格的绝对误差平均起来就是 MAE。

cannot_say:
  - MAE 6.9544 是所有 SKU 月一起平均的，需求量大的 SKU 的误差会被大量小 SKU 稀释。
  - 基线只用了历史需求量，没有用季节信息，所以它不是“最强的简单方法”。
  - 这条线是在验证期上定的；最终评估期会用同一个基线再对照一次。
