# 3.1 按时间切分 · notebook 导读
step: "3.1"
notebook: nb_3.1.ipynb

brief:
  background: 2.1 确认了有季节规律。要训练模型，数据得先摆成每个 SKU 每个月一行，并且按时间切开。
  question: 数据要摆成什么样才能训练？哪段训练、哪段验证、哪段留到最后评？
  answer: 摆成 SKU × 月的面板，再按月份先后切成训练、验证、最终评估三段。
  can_continue: true
  did: 补齐没有采购的月份记 0，然后按时间顺序切三段，不打乱。
  result: SKU × 月的面板写入 panel.parquet，每一行都标明属于训练期、验证期还是最终评估期。
  next: 4.1 在这张面板上构造只用过去信息的特征。

parts:
  - question: 为什么要给“没有采购”的月份也补一行？
    answer: 因为要预测的是每个 SKU 每个月的需求，没发生也是一种结果；补出来的行需求量记 0。
    meaning: 只拿有订单的月份训练，模型就只见过“有需求”的情况，遇到平时不动的 SKU 会把需求估高，备货就会积压。
    cells:
      - cell: 2
        title: 先算出应该有多少行
        what: 读清洗后的订单，去掉退货行，列出全部月份和全部 SKU，算出面板应有的规模。
        why: 先把“应该有多少行”算出来，下一格拼完之后就能对：多了说明连接出错，少了说明有 SKU 或月份漏了。
        read: 3,000 个 SKU × 24 个月 = 72,000 行面板。
      - cell: 3
        title: 铺满格子，把实际需求接上去
        what: 用 SKU 和月份的全组合做骨架，把实际的月度需求量接上去，接不上的填 0，再给每行打上划分标记。
        why: 填 0 不是编数据——那个 SKU 那个月确实没有被采购，需求量就是 0。这是“没发生”，不是“不知道”。
        read: 前几行是 SKU00001：2024-07 需求量 0、2024-08 是 30、2024-09 是 23、2024-10 是 5，都标着“训练”。
        lines:
          - line: 1
            note: cross 是笛卡尔积——每个 SKU 配上每个月份，先把格子铺满。
          - line: 4
            note: 左连接之后没接上的行，就是那个月没有采购，需求量填 0。
        data:
          title: 铺好之后的面板
          note: 本步的产物，平台现取前 5 行。
          frames:
            - label: SKU × 月面板
              file: steps/03_数据划分/3.1_按时间切分/outputs/panel.parquet
              columns: [SKU, 月份, 需求量, 划分]
              limit: 5
              mark:
                columns: [需求量]
                note: 第 1 行需求量是 0——那个月这个 SKU 没有采购，补的这一行正是模型要学的「没需求」。
              caption: 每个 SKU 每个月一行，没采购的月份补 0，划分列标明它属于训练、验证还是最终评估。

  - question: 三段时间怎么切？为什么不能随机切？
    answer: 按月份先后切：训练 54,000 行、验证 9,000 行、最终评估 9,000 行。
    meaning: 真实场景永远是拿过去预测未来。随机打乱切分等于让模型提前看过未来的月份，评估分数好看，上线就垮。
    cells:
      - cell: 4
        title: 三段各是哪几个月、各有多少行
        what: 统计每一段的月份范围和行数、SKU 数、需求量为 0 的比例，写成 split_summary.json。
        why: 切分方案要落成文件，后面每一步都按它执行；而不是各步自己按月份写死一遍，改一次就得改好几处。
        read: 训练 2024-07 至 2025-12 共 54000 行；验证 2026-01 至 2026-03 共 9000 行；最终评估 2026-04 至 2026-06 共 9000 行；3000 个 SKU；需求量为 0 的比例 0.2273。
      - cell: 5
        title: 写下结论
        what: 把面板规模、三段行数和零需求比例写成一句结论，结束这次运行。
        why: 这句话会出现在流程图的节点上和看板里，是别人看这一步的第一眼。
        read: 结论把 72,000 行、三段行数和 22.7% 的零需求比例并排写出来（比例四舍五入到一位小数）。

terms:
  - term: 划分
    plain: 面板里的一列标记，说明这一行属于训练、验证还是最终评估。后面每一步都靠它取数。
  - term: 笛卡尔积
    plain: 两个集合的全组合。3,000 个 SKU 配 24 个月，就是 72,000 种组合，先铺满再填数。

cannot_say:
  - 需求量为 0 占 22.73%，说明很多 SKU 平时不动。后面平均误差看起来小，未必是模型准，可能只是 0 多。
  - 面板按“下单月份”归月，跨月的订单没有做特殊处理。
  - 最终评估期的数据这一步只是标出来，后面任何步骤都不许拿它做比较或挑选。
